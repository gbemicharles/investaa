<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | InvestAA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { justify-content: center; align-items: center; background: #0a0b10; min-height: 100vh; }
        .auth-container { width: 100%; max-width: 450px; padding: 40px 20px; }
        .auth-card { text-align: center; }
        .verify-icon { font-size: 3.5rem; color: var(--accent-primary); margin-bottom: 16px; }
        .auth-header h2 { font-size: 1.9rem; margin-bottom: 10px; }
        .auth-header p { color: var(--text-muted); margin-bottom: 28px; line-height: 1.55; }
        .auth-header p strong { color: var(--text-primary); }
        .code-input {
            width: 100%;
            text-align: center;
            font-size: 28px !important;
            font-weight: 700;
            letter-spacing: 12px;
            padding: 18px 12px;
            font-family: 'Outfit', sans-serif;
        }
        .form-group { margin-bottom: 20px; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            background: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .resend-row {
            margin-top: 22px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .resend-row a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .msg-banner {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .msg-banner.success { background: rgba(34, 197, 94, 0.12); color: #4ade80; display: block; }
        .msg-banner.error { background: rgba(239, 68, 68, 0.12); color: #f87171; display: block; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <i class="fas fa-envelope-open-text verify-icon"></i>
            <div class="auth-header">
                <h2>Check your email</h2>
                <p>We sent a 6-digit verification code to <strong id="user-email">your email address</strong>. Enter it below to activate your account.</p>
            </div>
            <div id="msg-banner" class="msg-banner"></div>
            <form id="verifyForm">
                <div class="form-group">
                    <input type="text" id="code" class="code-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="000000" autocomplete="one-time-code" required>
                </div>
                <button type="submit" class="btn-primary" id="verifyBtn">Verify Email</button>
            </form>
            <div class="resend-row">
                Didn't get the code? <a id="resendBtn">Resend code</a>
            </div>
            <div class="resend-row">
                <a href="login.html">Back to sign in</a>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const username = params.get('u') || sessionStorage.getItem('verifyUsername') || '';
        const email = params.get('e') || sessionStorage.getItem('verifyEmail') || '';
        if (!username) {
            window.location.href = 'register.html';
        }
        sessionStorage.setItem('verifyUsername', username);
        if (email) {
            sessionStorage.setItem('verifyEmail', email);
            document.getElementById('user-email').innerText = email;
        }

        const banner = document.getElementById('msg-banner');
        function showMsg(text, type) {
            banner.className = 'msg-banner ' + type;
            banner.innerText = text;
        }

        const codeInput = document.getElementById('code');
        codeInput.addEventListener('input', e => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = codeInput.value.trim();
            if (code.length !== 6) { showMsg('Please enter the full 6-digit code.', 'error'); return; }
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true; btn.innerText = 'Verifying…';
            try {
                const data = await API.verifyEmail({ username, code });
                if (data.token) {
                    showMsg('Email verified! Redirecting…', 'success');
                    sessionStorage.removeItem('verifyUsername');
                    sessionStorage.removeItem('verifyEmail');
                    setTimeout(() => { window.location.href = 'index.html'; }, 800);
                } else {
                    showMsg(data.msg || 'Verification failed', 'error');
                    btn.disabled = false; btn.innerText = 'Verify Email';
                }
            } catch (err) {
                showMsg('Network error. Please try again.', 'error');
                btn.disabled = false; btn.innerText = 'Verify Email';
            }
        });

        document.getElementById('resendBtn').addEventListener('click', async () => {
            const link = document.getElementById('resendBtn');
            link.style.pointerEvents = 'none';
            link.innerText = 'Sending…';
            try {
                const data = await API.resendCode(username);
                showMsg(data.msg || 'A new code has been sent.', data.msg && data.msg.includes('sent') ? 'success' : 'error');
            } catch (err) {
                showMsg('Could not resend. Try again in a moment.', 'error');
            }
            setTimeout(() => {
                link.style.pointerEvents = '';
                link.innerText = 'Resend code';
            }, 30000);
        });
    </script>
</body>
</html>

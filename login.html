<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestAA | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { justify-content: flex-start; align-items: stretch; }
        .auth-header h2 { font-size: 2rem; margin-bottom: 8px; }
        .auth-header p { color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; }
        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }
        .input-wrapper input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            padding: 13px 14px 13px 44px;
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }
        .input-wrapper input:focus {
            border-color: var(--accent-primary);
            background: rgba(59,130,246,0.06);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }
        .btn-auth {
            width: 100%;
            justify-content: center;
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }
        .auth-footer {
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.88rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }
        .auth-footer a { color: var(--accent-primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .captcha-box {
            background: rgba(59,130,246,0.08);
            border: 1px solid rgba(59,130,246,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-primary);
            user-select: none;
        }
        .divider { height: 1px; background: var(--glass-border); margin: 24px 0; }
        .auth-back { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.85rem; text-decoration: none; margin-bottom: 32px; transition: color 0.2s; }
        .auth-back:hover { color: var(--text-main); }
        .auth-back i { font-size: 0.8rem; }
    </style>
</head>
<body class="dark-theme">

    <div class="auth-split">

        <!-- Left: Branded Panel -->
        <div class="auth-brand-panel">
            <div class="auth-brand-logo">Invest<span>AA</span></div>
            <div class="auth-brand-tagline">Your wealth.<br>Growing every day.</div>

            <!-- Mini Stats Row -->
            <div id="login-stats" style="display:flex;gap:16px;margin:20px 0 24px;">
                <div style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;">
                    <div style="font-size:1.35rem;font-weight:900;font-family:'Outfit',sans-serif;color:#f8fafc;" id="ls-members">—</div>
                    <div style="font-size:0.7rem;color:#94a3b8;margin-top:2px;">Total Members</div>
                </div>
                <div style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;">
                    <div style="font-size:1.35rem;font-weight:900;font-family:'Outfit',sans-serif;color:#10b981;" id="ls-active">—</div>
                    <div style="font-size:0.7rem;color:#94a3b8;margin-top:2px;">Active Investors</div>
                </div>
                <div style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px 16px;">
                    <div style="font-size:1.35rem;font-weight:900;font-family:'Outfit',sans-serif;color:#eab308;">99.9%</div>
                    <div style="font-size:0.7rem;color:#94a3b8;margin-top:2px;">Uptime</div>
                </div>
            </div>

            <!-- Live Activity Feed -->
            <div style="margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
                <span style="font-size:0.72rem;font-weight:700;letter-spacing:.06em;color:#94a3b8;">LIVE ACTIVITY</span>
                <span style="display:flex;align-items:center;gap:5px;font-size:0.7rem;color:#10b981;font-weight:600;"><span style="width:6px;height:6px;background:#10b981;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite;"></span> Live</span>
            </div>
            <div id="login-feed" style="display:flex;flex-direction:column;gap:6px;">
                <div style="height:46px;border-radius:10px;background:rgba(255,255,255,0.04);animation:shimmer 1.5s infinite;"></div>
                <div style="height:46px;border-radius:10px;background:rgba(255,255,255,0.04);animation:shimmer 1.5s infinite;"></div>
                <div style="height:46px;border-radius:10px;background:rgba(255,255,255,0.04);animation:shimmer 1.5s infinite;"></div>
                <div style="height:46px;border-radius:10px;background:rgba(255,255,255,0.04);animation:shimmer 1.5s infinite;"></div>
                <div style="height:46px;border-radius:10px;background:rgba(255,255,255,0.04);animation:shimmer 1.5s infinite;"></div>
            </div>
        </div>

        <!-- Right: Form Panel -->
        <div class="auth-form-panel">
            <div class="auth-form-inner">

                <div class="auth-form-logo">Invest<span>AA</span></div>

                <div class="auth-header">
                    <h2>Welcome back</h2>
                    <p>Sign in to access your investment dashboard.</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" autocapitalize="none" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Bot Verification: <span id="captcha-eq"></span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-robot"></i>
                            <input type="number" id="captcha-input" placeholder="Your answer" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth primary"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                </form>

                <div class="auth-footer">
                    <div><a href="forgot-password.html">Forgot your password?</a></div>
                    <div>Don't have an account? <a href="register.html">Sign up for free</a></div>
                </div>

            </div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script>
    // Load live activity feed + stats on login page
    (async () => {
        try {
            const [statsRes, feedRes] = await Promise.all([
                fetch('/api/public/stats'),
                fetch('/api/public/activity')
            ]);
            const stats = await statsRes.json();
            const feedData = await feedRes.json();

            // Stats
            const fmt = n => n >= 1000 ? (n/1000).toFixed(1) + 'K' : n;
            const mEl = document.getElementById('ls-members');
            const aEl = document.getElementById('ls-active');
            if (mEl) mEl.textContent = fmt(stats.total_members);
            if (aEl) aEl.textContent = fmt(stats.active_investors);

            // Feed
            const list = document.getElementById('login-feed');
            if (!list) return;
            list.innerHTML = '';
            (feedData.feed || []).slice(0, 6).forEach((item, i) => {
                const row = document.createElement('div');
                row.style.cssText = `display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);animation:feedSlideIn .35s ease both;animation-delay:${i*0.07}s;`;
                row.innerHTML = `
                    <div style="width:30px;height:30px;border-radius:8px;background:${item.color}22;color:${item.color};display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;"><i class="fas fa-${item.icon}"></i></div>
                    <div style="flex:1;font-size:.77rem;color:#cbd5e1;line-height:1.35;">${item.text}</div>
                    <div style="font-size:.68rem;color:#475569;white-space:nowrap;">${item.time}</div>
                `;
                list.appendChild(row);
            });
        } catch(e) {}
    })();
    </script>
    <script>
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const answer = num1 + num2;
        document.getElementById('captcha-eq').innerText = `${num1} + ${num2} = ?`;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const userInput = parseInt(document.getElementById('captcha-input').value);

            if (userInput !== answer) {
                alert('Captcha incorrect! Are you a bot?');
                return;
            }

            try {
                const data = await API.login({ login, password });
                if (data.token) {
                    window.location.href = 'index.html';
                } else if (data.requiresVerification) {
                    sessionStorage.setItem('verifyEmail', data.email || '');
                    window.location.href = `verify.html?u=${encodeURIComponent(data.username || '')}&e=${encodeURIComponent(data.email || '')}`;
                } else {
                    alert(data.msg || 'Login failed');
                }
            } catch (err) {
                console.error('[LOGIN_ERROR]', err);
                if (err.message.includes('Failed to fetch')) {
                    alert('Connection Error: The backend server is not responding. Please ensure your Replit is running.');
                } else {
                    alert('Login Error: ' + (err.message || 'Verification failed'));
                }
            }
        });
    </script>
</body>
</html>
